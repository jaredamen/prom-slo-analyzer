[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prom-slo-analyzer"
version = "0.1.0"
authors = [
    {name = "Jared (Yusef) Amen", email = "yusef@example.com"},
]
description = "Analyze Prometheus metrics for SLO readiness"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
]
keywords = ["prometheus", "slo", "sli", "monitoring", "observability", "metrics"]
dependencies = [
    "requests>=2.28.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
    "types-requests>=2.32.0",
]

[project.urls]
Homepage = "https://github.com/YusefAmen/prom-slo-analyzer"
Documentation = "https://github.com/YusefAmen/prom-slo-analyzer#readme"
Repository = "https://github.com/YusefAmen/prom-slo-analyzer.git"
"Bug Tracker" = "https://github.com/YusefAmen/prom-slo-analyzer/issues"
Changelog = "https://github.com/YusefAmen/prom-slo-analyzer/blob/main/CHANGELOG.md"
Sponsor = "https://github.com/sponsors/YusefAmen"

[project.scripts]
prom-slo-analyzer = "prom_slo_analyzer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/prom_slo_analyzer"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=src/prom_slo_analyzer",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Black code formatting
[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# Ruff linting
[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG001", # unused-function-argument
    "ARG002", # unused-method-argument
    "ARG003", # unused-class-method-argument
    "ARG004", # unused-static-method-argument
    "ARG005", # unused-lambda-argument
    "BLE001", # blind-except
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E501",  # line-too-long (handled by black)
    "RET504", # unnecessary-assign (sometimes clearer)
    "RET505", # superfluous-else-return (sometimes clearer)
    "SIM108", # if-else-block-instead-of-if-exp (sometimes clearer)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001", # pytest fixtures often have unused arguments
    "ARG002", # pytest fixtures often have unused arguments  
]

[tool.ruff.lint.isort]
known-first-party = ["prom_slo_analyzer"]

# MyPy type checking
[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
no_implicit_reexport = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

# Exclude test files from strict typing for easier testing
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

